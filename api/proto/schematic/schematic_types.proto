syntax = "proto3";

package kiapi.schematic.types;

import "common/types/base_types.proto";

enum SchematicLayer
{
  SL_UNKNOWN = 0;
  SL_WIRE = 1;
  SL_BUS = 2;
  SL_NOTES = 3;
}

/// Represents a schematic line segment, which may be a wire, bus, or graphical line
message Line
{
  kiapi.common.types.KIID    id     = 1;
  kiapi.common.types.Vector2 start  = 2;
  kiapi.common.types.Vector2 end    = 3;

  /**
   * One of: LAYER_BUS, LAYER_WIRE, LAYER_NOTES
   */
  SchematicLayer layer = 4;
}

message Text
{
  kiapi.common.types.Text text = 1;
}

message LocalLabel
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  Text                       text     = 3;
}

message GlobalLabel
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  Text                       text     = 3;
}

message HierarchicalLabel
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  Text                       text     = 3;
}

message DirectiveLabel
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  Text                       text     = 3;
}

message Junction
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  int32                      diameter = 3;
}

message NoConnect
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
}

message SchematicText
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  string                     text     = 3;
}

message SchematicField
{
  kiapi.common.types.KIID    id       = 1;
  string                     name     = 2;
  string                     text     = 3;
  kiapi.common.types.Vector2 position = 4;
  bool                       visible  = 5;
}

message SchematicSymbol
{
  kiapi.common.types.KIID              id                 = 1;
  kiapi.common.types.LibraryIdentifier library_identifier = 2;
  kiapi.common.types.Vector2           position           = 3;
  int32                                orientation        = 4;
  bool                                 mirror_x           = 5;
  bool                                 mirror_y           = 6;
  int32                                unit               = 7;
  int32                                body_style         = 8;
  repeated SchematicField              fields             = 9;
  bool                                 exclude_from_bom   = 10;
  bool                                 exclude_from_board = 11;
  bool                                 dnp                = 12;
}

message BusEntry
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  kiapi.common.types.Vector2 size     = 3;  // relative end offset from position
  bool                       is_bus   = 4;  // true = bus-to-bus, false = wire-to-bus
}

message SchematicShape
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  // Shape data depends on the EDA_SHAPE base — for now, just id + position
  // for type mapping support. Full geometry serialization can be added later.
}

message SchematicTextBox
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 start    = 2;
  kiapi.common.types.Vector2 end      = 3;
  string                     text     = 4;
}

message Sheet
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  kiapi.common.types.Vector2 size     = 3;
  string                     name     = 4;
  string                     filename = 5;
  repeated SchematicField    fields   = 6;
}

message SheetPin
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  string                     name     = 3;
  int32                      side     = 4;  // SHEET_SIDE enum
}
